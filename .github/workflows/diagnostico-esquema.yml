name: Diagnóstico de esquema (una vez)

# Workflow temporal: verifica si supabase/migracion-rutas.sql está aplicada y si
# el seed del código choca con los datos que ya hay en la BD.
# Usa el secret SUPABASE_ANON_KEY sin exponerlo: PostgREST distingue columna
# inexistente por el mensaje de error, y aquí solo se imprime la conclusión.

on:
  workflow_dispatch:

jobs:
  esquema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sondear columnas de la migración
        shell: bash {0}
        env:
          K: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          BASE="https://fmpubxikjdbdfvanfcok.supabase.co/rest/v1"

          sonda () {   # $1=tabla  $2=columna
            cuerpo=$(curl -sS --max-time 20 \
              "$BASE/$1?select=$2&limit=1" \
              -H "apikey: $K" -H "Authorization: Bearer $K" 2>/dev/null || echo "CURL_FALLO")
            case "$cuerpo" in
              *"does not exist"*)  echo "AUSENTE" ;;
              "["*|"{"*)           echo "OK" ;;
              CURL_FALLO)          echo "ERROR_REDE" ;;
              *)                   echo "INDEFINIDO:$(echo "$cuerpo" | head -c 90)" ;;
            esac
          }

          echo "── Estado del esquema (migracion-rutas.sql) ──"
          R1=$(sonda actividades orden)            ; printf "  actividades.orden            %s\n" "$R1"
          R2=$(sonda actividades etapa_id)         ; printf "  actividades.etapa_id         %s\n" "$R2"
          R3=$(sonda asignaciones etapa_id)        ; printf "  asignaciones.etapa_id        %s\n" "$R3"
          R4=$(sonda asignaciones actividad_id)    ; printf "  asignaciones.actividad_id    %s\n" "$R4"
          R5=$(sonda etapas orden)                 ; printf "  etapas.orden                 %s\n" "$R5"
          R7=$(sonda progreso actividad_id)        ; printf "  progreso.actividad_id        %s\n" "$R7"

          echo
          echo "── Contenido ──"
          for t in actividades etapas perfiles asignaciones progreso; do
            rango=$(curl -sS --max-time 20 -D - -o /dev/null \
                 "$BASE/$t?select=id&limit=1" \
                 -H "apikey: $K" -H "Authorization: Bearer $K" \
                 -H "Prefer: count=exact" 2>/dev/null \
                 | tr -d '\r' | grep -i '^content-range:' | sed 's#.*/##')
            printf "  %-14s %s filas\n" "$t" "${rango:-?}"
          done

          echo
          if [ "$R1" = OK ] && [ "$R3" = OK ]; then
            echo "VEREDICTO: la migración YA está aplicada."
          else
            echo "VEREDICTO: la migración NO está aplicada (faltan orden y etapa_id en asignaciones)."
          fi

      - name: Choca el seed con los datos de la BD
        shell: bash {0}
        env:
          K: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          BASE="https://fmpubxikjdbdfvanfcok.supabase.co/rest/v1"
          HDR=(-H "apikey: $K" -H "Authorization: Bearer $K")

          curl -sS --max-time 25 "${HDR[@]}" "$BASE/etapas?select=id,nombre,orden&limit=50" \
            > /tmp/etapas_bd.json
          curl -sS --max-time 25 "${HDR[@]}" \
            "$BASE/actividades?select=id,tipo,titulo,etapa_id&limit=60" \
            > /tmp/actividades_bd.json

          python3 scripts/checa_seed_vs_bd.py \
            /tmp/etapas_bd.json /tmp/actividades_bd.json src/lib/seed-activities.json

          echo
          curl -sS --max-time 25 "${HDR[@]}" "$BASE/perfiles?select=id,rol,nombre&limit=30" \
            > /tmp/perfiles.json
          curl -sS --max-time 25 "${HDR[@]}" \
            "$BASE/actividades?select=id,tipo,titulo,etapa_id,profesor_id&limit=80" \
            > /tmp/actividades_completas.json
          python3 scripts/estado_bd.py /tmp/perfiles.json /tmp/actividades_completas.json
