name: App Keep-Alive

on:
  schedule:
    # Every 6 hours — keeps the Vercel deployment warm
    - cron: "0 */6 * * *"
  workflow_dispatch:  # Allow manual trigger

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping deployed app on Vercel
        run: |
          set -e
          echo "Pinging Vercel deployment..."
          URL="https://plataforma-inclusion-adaptativa.vercel.app/login"
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS --max-time 20 --retry 2 -o "$RESPONSE_FILE" -w "%{http_code}" \
            "$URL" \
            -H "Accept: text/html")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Error: App did not return 200. Deployment may be down."
            cat "$RESPONSE_FILE"
            exit 1
          fi
          echo "App is awake and reachable."
